[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nicheradar"
version = "0.1.0"
description = "NicheRadar: functional niche discovery in spatial transcriptomics via Energy-MMD hypergraph learning."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anndata>=0.10",
    "matplotlib>=3.8",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "tqdm>=4.66",
    "torch>=2.0",
]

[project.optional-dependencies]
notebook = [
    "ipykernel>=6",
    "jupyterlab>=4",
    "scanpy>=1.10",
    "seaborn>=0.13",
]

[tool.setuptools.packages.find]
include = ["nicheradar*"]
